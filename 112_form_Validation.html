<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>

    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <div class="card p-5 mt-5">
                <form action="#" onsubmit="return formSubmit()" method="post">
                    
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" name="" id="name">

                    <label for="Mobile" class="form-label">Mobile No:</label>
                    <input type="tel" class="form-control" name="" id="phone">

                    <label for="Email" class="form-label">Email</label>
                    <input type="email" class="form-control" name="" id="email">

                    <label for="Password" class="form-label">Password</label>
                    <input type="password" class="form-control" name="" id="password">

                    <button type="submit" class="btn btn-success mt-3">Submit</button>
                </form>
            </div>
            </div>
        </div>
    </div>
    
    <script src="/DOM/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
